[package]
name = "strata-ingest"
version = "0.1.0"
edition = "2021"
description = "Bulk ingest for STRATA: CSV/JSON/XML network+ledger metadata into a columnar store"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
rayon = "1"
maxminddb = "0.24"
sha2 = "0.10"
hex = "0.4"
arrow = "56"
parquet = "56"

[profile.release]
opt-level = 3
lto = "thin"
